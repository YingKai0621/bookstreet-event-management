databases:
  - name: duongsach-db
    databaseName: duongsach
    user: duongsach_app
    plan: free
    region: singapore
    ipAllowList: []

services:
  - type: keyvalue
    name: duongsach-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: duongsach-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/auth/csrf
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: duongsach-db
          property: connectionString
      - key: POSTGRES_DB
        fromDatabase:
          name: duongsach-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: duongsach-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: duongsach-db
          property: password
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: duongsach-redis
          property: connectionString
      - key: MEDIA_STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://bookstreet-event-management.vercel.app
      - key: FRONTEND_BASE_URL
        value: https://bookstreet-event-management.vercel.app
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: SESSION_COOKIE_SAME_SITE
        value: None
      - key: FEEDBACK_THROTTLE_HMAC_SECRET
        generateValue: true
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SMTP_AUTH
        value: true
      - key: MAIL_STARTTLS_ENABLE
        value: true
      - key: GEMINI_API_KEY
        sync: false
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_RETURN_URL
        value: https://bookstreet-event-management.vercel.app/payment/vnpay/return
