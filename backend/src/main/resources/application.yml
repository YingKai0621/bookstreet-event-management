spring:
  application:
    name: bookstreet-backend

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      connect-timeout: 2s
      timeout: 2s

  session:
    timeout: 30m
    redis:
      namespace: bookstreet:session

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

rewards:
  booth-visit-points: ${REWARDS_BOOTH_VISIT_POINTS:10}

springdoc:
  swagger-ui:
    csrf:
      enabled: true

bookstreet:
  media:
    provider: ${MEDIA_STORAGE_PROVIDER:local}
    event-banner-directory: ${EVENT_BANNER_UPLOAD_DIR:uploads/event-banners}
    booth-image-directory: ${BOOTH_IMAGE_UPLOAD_DIR:uploads/booth-images}
    heritage-image-directory: ${HERITAGE_IMAGE_UPLOAD_DIR:uploads/heritage-images}
    activity-image-directory: ${ACTIVITY_IMAGE_UPLOAD_DIR:uploads/activity-images}
    badge-image-directory: ${BADGE_IMAGE_UPLOAD_DIR:uploads/badge-images}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  chatbot:
    api-key: ${GEMINI_API_KEY:${CHATBOT_API_KEY:}}
    model: ${CHATBOT_MODEL:gemini-3.5-flash-lite}
  feedback:
    throttle-hmac-secret: ${FEEDBACK_THROTTLE_HMAC_SECRET:}
  browser-security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
    session-cookie-same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
  email-verification:
    from-address: ${MAIL_FROM:no-reply@bookstreet.local}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      query-url: ${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay/return}
      checkout-duration-seconds: ${VNPAY_CHECKOUT_DURATION_SECONDS:900}
      query-min-interval-seconds: ${VNPAY_QUERY_MIN_INTERVAL_SECONDS:300}
      reconciliation-delay-seconds: ${VNPAY_RECONCILIATION_DELAY_SECONDS:300}
