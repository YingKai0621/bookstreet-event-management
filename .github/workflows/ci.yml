name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name || 'standard' }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: bookstreet_event_test
          POSTGRES_USER: bookstreet
          POSTGRES_PASSWORD: bookstreet_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookstreet -d bookstreet_event_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: bookstreet_event_test
      POSTGRES_USER: bookstreet
      POSTGRES_PASSWORD: bookstreet_ci_password
      EVENT_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/bookstreet_event_test
      EVENT_TEST_DATABASE_USER: bookstreet
      EVENT_TEST_DATABASE_PASSWORD: bookstreet_ci_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test and package backend
        working-directory: backend
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -Dspring.datasource.hikari.maximum-pool-size=2
          -Dspring.datasource.hikari.minimum-idle=0
          -Dspring.test.context.cache.maxSize=4
          verify

  frontend:
    name: Frontend checks
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  frontend-e2e:
    name: Frontend Playwright tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright UI regression suite
        working-directory: frontend
        run: npm run test:e2e
