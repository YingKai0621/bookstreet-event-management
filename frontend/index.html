<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <script>
      (() => {
        const attendancePath = '/participant/attendance/scan';
        const boothPath = '/participant/booth-scan';
        const isAttendanceScan = window.location.pathname === attendancePath;
        const isBoothScan = window.location.pathname === boothPath;
        if (!isAttendanceScan && !isBoothScan) return;

        const tokenValues = isAttendanceScan
          ? new URLSearchParams(window.location.search).getAll('token')
          : new URLSearchParams(window.location.hash.slice(1)).getAll('token');
        let consumed = false;
        const bootstrapKey = isAttendanceScan
          ? '__takeAttendanceScanTokenBootstrap'
          : '__takeBoothScanTokenBootstrap';
        Object.defineProperty(window, bootstrapKey, {
          configurable: true,
          value: () => {
            if (consumed) return null;
            consumed = true;
            const capturedValues = tokenValues.slice();
            tokenValues.fill('');
            return capturedValues;
          },
        });

        if (window.location.search || window.location.hash) {
          window.history.replaceState(
            window.history.state,
            '',
            isAttendanceScan ? attendancePath : boothPath,
          );
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/duong_sach_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Đường Sách TP.HCM - Điểm hẹn văn hóa đọc đặc trưng giữa lòng Sài Gòn. Khám phá các gian hàng sách, lịch sự kiện văn hóa, bản đồ tương tác và câu chuyện di sản." />
    <title>Đường Sách TP.HCM — Không Gian Văn Hóa Đọc & Điểm Hẹn Tri Thức</title>
